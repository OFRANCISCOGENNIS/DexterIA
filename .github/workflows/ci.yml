name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genisia
          POSTGRES_PASSWORD: genisia
          POSTGRES_DB: genisia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U genisia -d genisia_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Imagem do sandbox (backend docker)
        working-directory: infrastructure/docker
        run: docker build -t genisia-sandbox:latest -f sandbox.Dockerfile .
      - name: Testes (SQLite)
        run: python -m pytest -q
      - name: Testes (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://genisia:genisia@localhost:5432/genisia_test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
